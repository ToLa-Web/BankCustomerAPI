services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bank-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourPass123"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPass123' -Q 'SELECT 1' -C" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    image: bankingsystemapi.api
    build:
      context: .
      dockerfile: BankingSystemAPI.API/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BankingSystemDB;User=sa;Password=YourPass123;TrustServerCertificate=True"
    develop:
      watch:
        - action: rebuild
          path: .
volumes:
  sql_data:
